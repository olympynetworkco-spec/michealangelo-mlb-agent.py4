                                                                                      let result = [];
                                                                                      for (let line of lines) {
                                                                                      line = line.trim();
                                                                                      if (line.match(/^<\/(\w+)/)) indent = Math.max(0, indent - 1);
                                                                                      result.push('  '.repeat(indent) + line);
                                                                                      if (line.match(/^<(\w+)[^>]*>/) && !line.match(/^<\/(\w+)/) && !line.match(/\/>$/)) indent++;
                                                                                      }
                                                                                      editor.value = result.join('\n');
                                                                                      updatePreview();
                                                                                      } catch(e) {
                                                                                      alert('Format oops! Try simpler HTML.');
                                                                                      }
                                                                                      };
                                                                                      
                                                                                      window.expandAll = function() {
                                                                                      // Just a fun visual: show all code (no folding) — we just scroll to top
                                                                                      editor.scrollTop = 0;
                                                                                      // also expand by setting height auto (but textarea already shows all)
                                                                                      editor.style.height = 'auto';
                                                                                      editor.style.height = editor.scrollHeight + 'px';
                                                                                      };
                                                                                      
                                                                                      window.collapseAll = function() {
                                                                                      // reset height
                                                                                      editor.style.height = '100%';
                                                                                      };
                                                                                      
                                                                                      window.loadTemplate = function() {
                                                                                      editor.value = `<!DOCTYPE html>
                                                                                      <html>
                                                                                        <head>
                                                                                          <title> ོ ☁︎ ོ Editorial ! DOC Tool</title>
                                                                                          </head>
                                                                                          <body style="font-family:Comic Sans MS;background:#f0e8d0;padding:0.05%;">
                                                                                            <h1 style="color:#ff3b3b;text-shadow:1px 1px 1 #f12;">☁︎ ོ    ོ Editorial !!</h1>
                                                                                              <p style="font-size:1.0rem;background:#ffff;display:inline-block;padding:4px 10px;border:2px solid #000;box-shadow:4px 4px 0 #f12;">DOC ☁︎ ོ 
                                                                                                <ul> </p>  " welcome to edi editorial " <p>

<div>                                                                                                                                                              <li>CSS</li>  
<li>BODY</li>  
<li>JAVASCRIPT</li>                                                                              <li>Live preview</li>
<li>create,articulate,accelrate your masters with alfred and Edi-editoral</li>                                                                                                      </ul>
                                                                                                  </body>
                                                                                                </html>`;
                                                                                                updatePreview();
                                                                                                };
                                                                                                
                                                                                                window.refreshFrame = function() {
                                                                                                  // Refresh ONLY the preview iframe. Editor text is never touched.
                                                                                                  clearTimeout(previewTimeout);              // drop any pending debounced render
                                                                                                  const html = editor.value;
                                                                                                  const old = previewFrame;
                                                                                                  const scrollY = (() => { try { return old.contentWindow.scrollY; } catch (e) { return 0; } })();

                                                                                                  // Brand-new iframe = kills stuck scripts, timers, listeners and toggle state from the old one
                                                                                                  const fresh = document.createElement('iframe');
                                                                                                  fresh.className = old.className;
                                                                                                  fresh.id = old.id;
                                                                                                  fresh.setAttribute('sandbox', old.getAttribute('sandbox'));
                                                                                                  old.replaceWith(fresh);
                                                                                                  previewFrame = fresh;

                                                                                                  const doc = fresh.contentDocument || fresh.contentWindow.document;
                                                                                                  doc.open();
                                                                                                  doc.write(html);
                                                                                                  doc.close();

                                                                                                  // restore scroll position after render
                                                                                                  setTimeout(() => { try { fresh.contentWindow.scrollTo(0, scrollY); } catch (e) {} }, 50);
                                                                                                  if (sniperActive) setTimeout(injectSniper, 300);
                                                                                                };


                                                                                                window.clearEditor = function() {
                                                                                                if (confirm('🧨 Clear the editor?')) {
                                                                                                editor.value = '';
                                                                                                updatePreview();
                                                                                                }
                                                                                                };
                                                                                                
                                                                                                // ---------- FIND & REPLACE ----------
                                                                                                window.findAndReplace = function(mode) {
                                                                                                const findInput = document.getElementById('findInput');
                                                                                                const findText = findInput.value;
                                                                                                if (!findText) {
                                                                                                alert('🔍 Enter a word to find!');
                                                                                                return;
                                                                                                }
                                                                                                const current = editor.value;
                                                                                                if (mode === 'replaceAll') {
                                                                                                // escape regex special chars
                                                                                                const escaped = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                                                                                                const replaceWith = prompt('Replace ALL with:', '');
                                                                                                if (replaceWith === null) return;
                                                                                                const regex = new RegExp(escaped, 'g');
                                                                                                editor.value = current.replace(regex, replaceWith);
                                                                                                updatePreview();
                                                                                                } else if (mode === 'replaceCurrent') {
                                                                                                // replace first occurrence only (from cursor position)
                                                                                                const cursorPos = editor.selectionStart;
                                                                                                const before = current.substring(0, cursorPos);
                                                                                                const after = current.substring(cursorPos);
                                                                                                const replaceWith = prompt('Replace this occurrence with:', '');
                                                                                                if (replaceWith === null) return;
                                                                                                const idx = after.indexOf(findText);
                                                                                                if (idx === -1) {
                                                                                                alert('❌ "' + findText + '" not found after cursor.');
                                                                                                return;
                                                                                                }
                                                                                                const newAfter = after.substring(0, idx) + replaceWith + after.substring(idx + findText.length);
                                                                                                editor.value = before + newAfter;
                                                                                                // set cursor after replacement
                                                                                                editor.selectionStart = editor.selectionEnd = before.length + idx + replaceWith.length;
                                                                                                editor.focus();
                                                                                                updatePreview();
                                                                                                }
                                                                                                };
                                                                                                
                                                                                                // ---------- IMPORT / EXPORT ----------
                                                                                                window.importFile = function(event) {
                                                                                                const file = event.target.files[0];
                                                                                                if (!file) return;
                                                                                                const reader = new FileReader();
                                                                                                reader.onload = (e) => {
                                                                                                editor.value = e.target.result;
                                                                                                updatePreview();
                                                                                                };
                                                                                                reader.readAsText(file);
                                                                                                event.target.value = ''; // reset
                                                                                                };
                                                                                                
                                                                                                window.downloadHTML = function() {
                                                                                                const content = editor.value;
                                                                                                const blob = new Blob([content], { type: 'text/html' });
                                                                                                const url = URL.createObjectURL(blob);
                                                                                                const a = document.createElement('a');
                                                                                                a.href = url;
                                                                                                a.download = '☁︎ ོ Editorial !-DOC.html';
                                                                                                document.body.appendChild(a);
                                                                                                a.click();
                                                                                                document.body.removeChild(a);
                                                                                                URL.revokeObjectURL(url);
                                                                                                };
                                                                                                
                                                                                                // ---------- KEYBOARD SHORTCUTS ----------
                                                                                                document.addEventListener('keydown', (e) => {
                                                                                                // Alt+1 preview, Alt+2 highlight, Alt+3 format, Alt+4 expand, Alt+5 collapse, Alt+6 Refresh, Alt+7 clear, Alt+8 sniper
                                                                                                if (e.altKey) {
                                                                                                const map = {
                                                                                                '1': previewHTML,
                                                                                                '2': highlightFull,
                                                                                                '3': formatHTML,
                                                                                                '4': expandAll,
                                                                                                '5': collapseAll,
                                                                                                '6': refreshFrame,
                                                                                                '7': clearEditor,
                                                                                                '8': toggleSniper,
                                                                                                };
                                                                                                const fn = map[e.key];
                                                                                                if (fn) { e.preventDefault(); fn(); }
                                                                                                }
                                                                                                // Ctrl+F focus find
                                                                                                if (e.ctrlKey && e.key === 'f') {
                                                                                                e.preventDefault();
                                                                                                document.getElementById('findInput').focus();
                                                                                                document.getElementById('findInput').select();
                                                                                                }
                                                                                                });
                                                                                                
                                                                                                // ---------- INIT ----------
                                                                                                // load starter template on first start
                                                                                                loadTemplate();
                                                                                                // preview after load
                                                                                                setTimeout(updatePreview, 300);
                                                                                                })();
                                                                                              </script>
                                                                                            </body>
                                                                                          </html>
