<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLB Trading Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚾︎</text></svg>" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg-page:#f4f5f8;
  --bg-card:#ffffff;
  --border:#e0e3eb;
  --border-soft:#eceef2;
  --text:#131722;
  --text-soft:#5c6270;
  --text-faint:#9298a5;
  --blue:#2962ff;
  --blue-soft:#eaf0ff;
  --green:#089981;
  --green-soft:#e5f7f2;
  --red:#f23645;
  --red-soft:#feecee;
  --purple:#a855f7;
  --grey-off:#4b4f58;
  --amber:#ff9800;
  --amber-soft:#fff4e0;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg-page);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  padding:20px;
}
.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:start;transition:grid-template-columns .25s ease;}
.app.expanded{grid-template-columns:230px 1fr;}

/* ---------- drop bar ---------- */
.dropbar{
  grid-column:1 / -1;
  background:var(--bg-card);
  border:1px dashed var(--border);
  border-radius:var(--radius);
  padding:10px 16px;
  display:flex;align-items:center;gap:10px;
  font-size:12.5px;color:var(--text-soft);
  margin-bottom:2px;
  transition:border-color .15s, background .15s;
}
.dropbar.dragover{border-color:var(--blue);background:var(--blue-soft);}
.dropbar strong{color:var(--text);}
.dropbar label{
  margin-left:auto;background:var(--text);color:#fff;font-weight:600;font-size:11.5px;
  padding:6px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;
}
#dropStatus{font-size:11.5px;font-weight:600;}
#dropStatus.ok{color:var(--green);}
#dropStatus.err{color:var(--red);}

/* ---------- Jarvis mode: toast alerts ---------- */
#jarvisToastStack{
  position:fixed; bottom:20px; right:20px; z-index:9999;
  display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  pointer-events:none;
}
.jarvis-toast{
  min-width:260px; max-width:340px;
  background:var(--text); color:#fff;
  border-radius:12px; padding:12px 16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0; transform:translateY(12px) scale(.97);
  transition:opacity .25s ease, transform .25s ease;
  border-left:4px solid var(--blue);
}
.jarvis-toast.show{ opacity:1; transform:translateY(0) scale(1); }
.jarvis-toast.live{ border-left-color:var(--red); }
.jarvis-toast.final{ border-left-color:var(--green); }
.jarvis-toast.odds{ border-left-color:var(--amber); }
.jarvis-toast .jt-title{ font-size:12.5px; font-weight:700; margin-bottom:3px; }
.jarvis-toast .jt-sub{ font-size:11.5px; color:rgba(255,255,255,.75); }


/* ---------- sidebar (lite-panda dock) ---------- */
.side-panel{
  background:linear-gradient(180deg,#14161c 0%,#0b0d12 100%);
  background-image:url('file:///Users/olympynetworkco/Desktop/themes/rolex.png');
  background-size:cover;
  background-position:center;
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  width:76px;
  overflow:hidden;
  position:sticky;
  top:20px;
  transition:width .25s ease;
  max-height:calc(100vh - 40px);
  display:flex;
  flex-direction:column;
}
.side-panel.expanded{width:230px;}
.side-panel-tools,.side-panel-clock{
  flex-shrink:0;
  background:rgba(10,11,16,.82);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.side-panel-inner{
  background:rgba(10,11,16,.82);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  padding:10px 8px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.panel-toggle{
  width:100%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:none;color:#fff;
  padding:8px 0;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:8px;
  transition:background .15s;
}
.panel-toggle:hover{background:rgba(255,255,255,.14);}
.side-panel.expanded .panel-toggle{justify-content:flex-start;padding-left:12px;gap:8px;}
.panel-toggle .arrow{transition:transform .25s;}
.side-panel.expanded .panel-toggle .arrow{transform:rotate(180deg);}
.divider-label{
  font-size:10px;font-weight:700;letter-spacing:.07em;color:rgba(255,255,255,.4);
  text-transform:uppercase;padding:8px 8px 3px;white-space:nowrap;
}
.side-panel:not(.expanded) .divider-label{display:none;}
.panel-sep{width:100%;height:1px;background:rgba(255,255,255,.08);margin:4px 0;}
.panel-item{
  display:flex;align-items:center;gap:12px;
  padding:7px 8px;width:100%;color:#E5E5EA;
  background:transparent;border:none;text-align:left;
  border-radius:8px;cursor:pointer;transition:background .15s;
  white-space:nowrap;font-size:12.5px;font-family:inherit;
}
.panel-item:hover{background:rgba(255,255,255,.08);}
.panel-item.active{background:rgba(41,98,255,.22);color:#fff;}
.panel-item.active .abbr{color:#5b8dff;opacity:1;}

.panel-item .icon img{width:100%;height:100%;object-fit:contain;}
.panel-item .icon{position:relative;}

.panel-item .label{
  opacity:0;width:0;overflow:hidden;transition:opacity .2s;font-weight:500;
}
.side-panel.expanded .panel-item .label{opacity:1;width:auto;}

/* ---- status dot: replaces the old text abbreviation on the right of each team row ---- */
.panel-item .abbr{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  margin-left:auto;background:var(--grey-off);box-shadow:none;
  display:none;
}
.side-panel.expanded .panel-item .abbr{display:inline-block;}
.panel-item.active .abbr{opacity:1;}
.panel-item .abbr.live{background:var(--green);box-shadow:0 0 7px var(--green);animation:dotPulse 1.2s ease-in-out infinite;}
.panel-item .abbr.scheduled{background:var(--red);box-shadow:0 0 5px var(--red);}
.panel-item .abbr.off{background:var(--grey-off);box-shadow:none;}
.panel-item .abbr.score-change{background:var(--purple);box-shadow:0 0 8px var(--purple);animation:dotPulse .6s ease-in-out 5;}

@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.3);}}

.panel-item .rec-mini{
  margin-left:auto;font-size:10px;opacity:.5;display:none;
}
.side-panel.expanded .panel-item .rec-mini{display:inline;}
.panel-item.add-lynx{border:1px dashed rgba(255,255,255,.25);margin-top:6px;justify-content:center;}
.side-panel.expanded .panel-item.add-lynx{justify-content:flex-start;}
.panel-item.add-lynx:hover{border-color:rgba(255,255,255,.5);}

/* ---------- side panel: tools (finder / sync / jarvis) ---------- */
.side-panel-tools{padding:10px 8px 4px;}
.side-panel:not(.expanded) .side-panel-tools{padding:10px 8px 4px;}

.finder-wrap{
  position:relative;display:flex;align-items:center;margin-bottom:8px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;overflow:hidden;transition:background .15s;
}
.finder-wrap:focus-within{background:rgba(255,255,255,.12);border-color:rgba(91,141,255,.5);}
.finder-icon{padding:0 0 0 10px;color:rgba(255,255,255,.4);font-size:13px;flex-shrink:0;}
.finder-input{
  width:100%;background:transparent;border:none;outline:none;color:#E5E5EA;
  font-family:inherit;font-size:12.5px;padding:8px 8px 8px 6px;min-width:0;
}
.finder-input::placeholder{color:rgba(255,255,255,.35);}
.side-panel:not(.expanded) .finder-wrap{width:32px;height:32px;border-radius:8px;justify-content:center;}
.side-panel:not(.expanded) .finder-input{display:none;}
.side-panel:not(.expanded) .finder-icon{padding:0;}

.tool-row .tool-dot{
  width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);
  margin-left:auto;flex-shrink:0;display:none;
}
.side-panel.expanded .tool-row .tool-dot{display:inline-block;}
.tool-row .tool-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
.tool-row .chev{
  font-size:9px;color:rgba(255,255,255,.35);margin-left:6px;flex-shrink:0;
  transition:transform .2s;display:none;
}
.side-panel.expanded .tool-row .chev{display:inline-block;}
.tool-row.open .chev{transform:rotate(180deg);}
.tool-row.open{background:rgba(255,255,255,.06);}

.tool-panel{max-height:0;overflow:hidden;transition:max-height .22s ease;}
.tool-panel.open{max-height:220px;}
.side-panel:not(.expanded) .tool-panel{display:none;}

.dropbar-sb{
  grid-column:auto;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15);
  border-radius:9px;padding:9px 9px 10px;margin:2px 4px 8px;font-size:11px;line-height:1.45;
  color:rgba(255,255,255,.6);display:flex;flex-wrap:wrap;align-items:center;gap:6px;
}
.dropbar-sb strong{color:#E5E5EA;}
.dropbar-sb label{
  margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:10.5px;
  padding:5px 11px;border-radius:14px;cursor:pointer;white-space:nowrap;
}
.dropbar-sb #dropStatus{font-size:10.5px;font-weight:700;flex-basis:100%;}
.dropbar-sb #dropStatus.ok{color:var(--green);}
.dropbar-sb #dropStatus.err{color:var(--red);}
.dropbar-sb #liveSyncStatus,.dropbar-sb #jarvisStatus{font-size:10.5px;flex-basis:100%;color:rgba(255,255,255,.5);}

/* Jarvis MP3 picker — grey when empty, green when file chosen (mirrors Enable Jarvis / Connect folder) */
#jarvisMp3ChooseBtn{
  background: var(--text-faint);   /* grey default, same as "Enable Jarvis" when off */
  transition: background .15s;
}
#jarvisMp3ChooseBtn.picked{
  background: var(--green);        /* green when an MP3 is picked */
}

.side-panel-clock{
  display:flex;align-items:center;gap:6px;justify-content:center;
  padding:9px 8px;border-top:1px solid rgba(255,255,255,.08);
  font-size:10.5px;color:rgba(255,255,255,.4);white-space:nowrap;overflow:hidden;
  font-variant-numeric:tabular-nums;
}
.side-panel-clock .clk-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 5px var(--green);}
.side-panel-clock .clk-date{color:rgba(255,255,255,.25);}
.side-panel:not(.expanded) .side-panel-clock .clk-date{display:none;}

.panel-item.team-hidden,.divider-label.team-hidden{display:none;}

/* ---------- main card ---------- */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:0 1px 2px rgba(20,25,40,.03);}
.card + .card{margin-top:16px;}

.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.head-left{display:flex;align-items:center;gap:14px;}
.logo-badge{
  width:56px;height:56px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px;
}
.logo-badge img{width:100%;height:100%;object-fit:contain;border-radius:14px;}
.head-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.head-name h1{font-size:26px;font-weight:800;letter-spacing:-.5px;}
.pct-chip{font-size:16px;font-weight:700;display:flex;align-items:center;gap:3px;}
.pct-chip.up{color:var(--green);}
.pct-chip.down{color:var(--red);}
.head-sub{color:var(--text-soft);font-size:12.5px;margin-top:3px;}
.head-sub .tag{background:var(--border-soft);color:var(--text-soft);border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-left:6px;}
.head-sub .tag.lynx-link{cursor:pointer;color:var(--blue);background:var(--blue-soft);text-decoration:none;border:none;font-family:inherit;}
.head-sub .tag.lynx-link:hover{background:var(--blue);color:#fff;}

/* ---------- signal badge (compact, next to team name) + its detail drawer ---------- */
.signal-badge{
  border:none;cursor:pointer;color:#fff;font-size:11px;font-weight:700;
  padding:4px 10px 4px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;
  letter-spacing:.01em;box-shadow:0 1px 3px rgba(20,25,40,.15);
}
.signal-badge:hover{filter:brightness(1.08);}
.signal-badge .chev{font-size:8px;opacity:.85;transition:transform .2s;}
.signal-badge.open .chev{transform:rotate(180deg);}
.signal-detail{max-height:0;overflow:hidden;transition:max-height .28s ease;}
.signal-detail.open{max-height:220px;}
.signal-detail .signal-card{margin-top:0;margin-bottom:16px;}

/* ---------- tabs row + team info popover ---------- */
.tabs-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.info-toggle{
  background:var(--bg-page);border:1px solid var(--border);border-radius:20px;
  font-family:inherit;font-size:11px;font-weight:700;color:var(--text-soft);
  padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:5px;
  margin-bottom:8px;white-space:nowrap;
}
.info-toggle:hover{background:var(--border-soft);}
.info-toggle .chev{font-size:8px;transition:transform .2s;}
.info-toggle.open .chev{transform:rotate(180deg);}
.team-info-pop{
  position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:300px;max-width:calc(100vw - 60px);
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 12px 32px rgba(20,25,40,.16);padding:12px;
  opacity:0;visibility:hidden;transform:translateY(-6px);pointer-events:none;
  transition:opacity .18s ease, transform .18s ease, visibility .18s;
}
.team-info-pop.open{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
.team-info-pop .stats-grid{grid-template-columns:repeat(2,1fr);}

.signal-box{border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center;min-width:150px;}
.signal-box .lbl{font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
.bars{display:flex;gap:3px;justify-content:center;margin:7px 0 5px;}
.bars span{width:8px;height:16px;border-radius:2px;background:var(--border-soft);}
.bars span.on.up{background:var(--green);}
.bars span.on.down{background:var(--red);}
.signal-box .strength{font-size:12px;font-weight:800;letter-spacing:.03em;}
.strength.up{color:var(--green);}
.strength.down{color:var(--red);}
.strength.flat{color:var(--amber);}

/* ---------- head-right stack (confidence signal + probability remote) ---------- */
.head-right{display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.remote-box{
  border:1px solid var(--border);border-radius:10px;padding:8px 16px 9px;text-align:center;min-width:150px;
  background:var(--bg-page);
}
.remote-box .lbl{font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
.remote-readout{display:flex;align-items:center;justify-content:center;gap:6px;margin:5px 0 2px;}
.remote-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .15s, box-shadow .15s;}
.remote-dot.live{background:var(--red);box-shadow:0 0 6px var(--red);animation:remotePulse 1s infinite;}
@keyframes remotePulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.remote-val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--text);transition:color .12s;}
.remote-val.live{color:var(--blue);}
.remote-sub{font-size:9.5px;color:var(--text-faint);font-weight:600;font-variant-numeric:tabular-nums;}

/* ---------- heartbeat card (Alfred / Jarvis notification pulse) ---------- */
.heartbeat-box{
  border:1px solid var(--border);border-radius:10px;padding:8px 16px 9px;text-align:center;min-width:150px;
  background:var(--bg-page);flex:1 1 170px;max-width:230px;align-self:center;
}
.heartbeat-box .lbl{font-size:9.5px;letter-spacing:.08em;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
.heartbeat-readout{display:flex;align-items:center;justify-content:center;gap:6px;margin:5px 0 2px;}
.heartbeat-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .15s, box-shadow .15s;}
.heartbeat-dot.live{background:var(--red);box-shadow:0 0 6px var(--red);animation:remotePulse 1s infinite;}
.heartbeat-val{font-size:14px;font-weight:800;letter-spacing:.01em;color:var(--text);transition:color .12s;}
.heartbeat-val.live{color:var(--blue);}
.heartbeat-sub{font-size:9.5px;color:var(--text-faint);font-weight:600;}

.tabs{display:flex;gap:4px;}
.tf-tab{
  background:none;border:none;font-family:inherit;cursor:pointer;
  padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--text-faint);
  border-bottom:2px solid transparent;
}
.tf-tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.chart-wrap{height:270px;margin-bottom:6px;}
.chart-foot{display:flex;justify-content:space-between;align-items:center;color:var(--text-faint);font-size:10.5px;margin:2px 0 18px;}

.stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.stat-card{border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;background:var(--bg-page);}
.stat-card .lbl{font-size:10px;color:var(--text-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.stat-card .val{font-size:17px;font-weight:800;}
.stat-card .sub{font-size:10px;color:var(--text-faint);margin-top:2px;}
.stat-card .val.green{color:var(--green);}
.stat-card .val.red{color:var(--red);}

/* signal / animal card */
.signal-card{
  display:flex;align-items:center;gap:18px;border-radius:16px;padding:20px 24px;margin-top:16px;color:#fff;
}
.signal-card .art{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;overflow:hidden;}
.signal-card .art img{width:100%;height:100%;object-fit:cover;}
.signal-card h2{font-size:19px;letter-spacing:.03em;margin-bottom:3px;}
.signal-card p{font-size:12.5px;opacity:.92;line-height:1.4;}

/* related grid */
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px;}
.rel-col h5{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;font-weight:700;}
.rel-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.rel-row:last-child{border-bottom:none;}
.rel-row .r{color:var(--text-soft);}
.win{color:var(--green);font-weight:700;}
.loss{color:var(--red);font-weight:700;}
.matchup-vs{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 10px;}
.matchup-vs .mv-team{text-align:center;font-size:11px;font-weight:700;}
.matchup-vs .vs{color:var(--text-faint);font-size:10px;}
.mini-badge{display:inline-block;background:var(--border-soft);border-radius:6px;padding:2px 7px;font-size:10.5px;color:var(--text-soft);font-weight:600;}

/* ---------- game card (from cards.html) ---------- */
.gc-mini{
  border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;
  cursor:pointer;transition:box-shadow .2s, transform .15s;background:var(--bg-page);
}
.gc-mini:hover{box-shadow:0 4px 16px rgba(20,25,40,.08);transform:translateY(-1px);}
.gc-mini .gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.gc-mini .gc-teams{font-size:12px;font-weight:700;}
.gc-mini .gc-teams .at{color:var(--text-faint);font-weight:400;}
.gc-status{font-size:8.5px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:8px;background:var(--border-soft);color:var(--text-soft);}
.gc-status.live{background:var(--red-soft);color:var(--red);animation:gcPulse 2s infinite;}
.gc-status.final{background:var(--blue-soft);color:var(--blue);}
@keyframes gcPulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.gc-score{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0;font-size:20px;font-weight:800;}
.gc-score .vs{font-size:11px;color:var(--text-faint);font-weight:400;}
.gc-score .away{color:var(--red);}
.gc-score .home{color:var(--green);}
.gc-mini .gc-chart-wrap{height:56px;margin-top:6px;}
.gc-hint{text-align:center;font-size:9.5px;color:var(--text-faint);margin-top:4px;}

.gco-overlay{
  display:none;position:fixed;inset:0;background:rgba(10,12,20,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:9999;padding:30px;justify-content:center;align-items:center;
}
.gco-overlay.open{display:flex;}
.gco-content{
  background:var(--bg-card);border-radius:18px;max-width:640px;width:100%;max-height:88vh;
  padding:26px 28px 30px;position:relative;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.35);
}
.gco-close{
  position:absolute;top:14px;right:16px;background:var(--border-soft);border:none;
  width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--text);
}
.gco-title{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.gco-sub{font-size:12px;color:var(--text-soft);margin-bottom:14px;}
.gco-score{display:flex;align-items:center;justify-content:center;gap:26px;font-size:38px;font-weight:800;padding:10px 0 14px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
.gco-score .vs{font-size:15px;color:var(--text-faint);font-weight:400;}
.gco-score .away{color:var(--red);}
.gco-score .home{color:var(--green);}
.gco-chart-wrap{height:220px;margin-bottom:14px;}
.gco-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.gco-stats .os{background:var(--bg-page);border-radius:8px;padding:8px 10px;text-align:center;}
.gco-stats .os .lbl{font-size:9px;text-transform:uppercase;color:var(--text-faint);font-weight:700;}
.gco-stats .os .val{font-size:14px;font-weight:800;margin-top:2px;}

/* standings */
.standings-head{display:flex;justify-content:space-between;align-items:center;margin-top:22px;margin-bottom:10px;}
.standings-head h3{font-size:13px;letter-spacing:.03em;}
.standings-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.st-card{border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;background:var(--bg-page);}
.st-card.me{border-color:var(--blue);background:var(--blue-soft);}
.st-card .top{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.st-dot{width:22px;height:22px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800;}
.st-card .nm{font-size:12px;font-weight:700;}
.st-card .rec{font-size:11px;color:var(--text-soft);}
.st-card .chg{font-size:11px;font-weight:700;}

.updated-line{grid-column:1/-1;text-align:center;color:var(--text-faint);font-size:10.5px;margin-top:4px;}

@media (max-width:1000px){
  .app{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:repeat(3,1fr);}
  .related-grid{grid-template-columns:repeat(2,1fr);}
  .standings-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

        <span class="chev">▾</span>

      </div>

      <button class="panel-item tool-row" id="jarvisToggleRow" data-target="jarvisPanel" title="Jarvis Mode">

        <span class="label">Jarvis Mode</span>

        </div>


        <div class="dropbar dropbar-sb" id="jarvisMp3Bar" style="cursor:default;">

          <button id="jarvisMp3ChooseBtn" style="margin-left:auto;color:#fff;border:none;font-weight:600;font-size:11.5px;padding:6px 14px;border-radius:20px;cursor:pointer;">Choose MP3</button>
          <button id="jarvisMp3ClearBtn" style="background:rgba(255,255,255,.14);color:#fff;border:none;font-weight:600;font-size:10.5px;padding:5px 11px;border-radius:14px;cursor:pointer;display:none;">Clear</button>
        </div>
      </div>

      <div class="panel-sep"></div>
    </div>

    <div class="side-panel-inner" id="sidebar"></div>

    <div class="side-panel-clock" id="sidePanelClock">
      <span class="clk-dot"></span><span id="clkTime">--:--:--</span><span class="clk-date" id="clkDate"></span>
    </div>
  </div>

  <div id="main"></div>

  <div class="updated-line" id="updatedLine"></div>
</div>

<div id="jarvisToastStack"></div>

  </div>
</div>

let runsByAbbr = {}, standingsByAbbr = {}, divisionByAbbr = {}, completeByAbbr = {}, oddsByAbbr = {}, gamesByAbbr = {}, lynxByAbbr = {};
const ABBR_FIX = {CHW:"CWS", WAS:"WSH", ARI:"AZ"}; // odd/alt abbreviations seen across your feeds
function fixAbbr(code){ if(!code) return null; code = code.trim().toUpperCase(); return ABBR_FIX[code] || (TEAM_COLORS[code]?code:null); }

function reindex(){
  runsByAbbr = {};
  (RUNS.teams||[]).forEach(t=>{ runsByAbbr[t.abbr] = t; });

  gamesByAbbr = {};
  (GAMES.teams||[]).forEach(t=>{ const ab = fixAbbr(t.abbr) || t.abbr; gamesByAbbr[ab] = t; });

  lynxByAbbr = {};
  (TEAM_LYNX.teams||[]).forEach(t=>{ const ab = fixAbbr(t.abbr) || t.abbr; lynxByAbbr[ab] = t; });

  standingsByAbbr = {}; divisionByAbbr = {};
  (STANDINGS.standings||[]).forEach(lg=>{
    (lg.divisions||[]).forEach(div=>{
      (div.teams||[]).forEach(t=>{
        const ab = Object.keys(FULL_NAMES).find(a=>FULL_NAMES[a]===t.team);
        if(!ab) return;
        standingsByAbbr[ab] = t;
        divisionByAbbr[ab] = {league:lg.league, name:div.name, teams:div.teams};
      });
    });
  });

  completeByAbbr = {};
  if(COMPLETE && COMPLETE.games){
    COMPLETE.games.forEach(g=>{
      const a = fixAbbr(g.away_abbr), h = fixAbbr(g.home_abbr);
      if(a) completeByAbbr[a] = {...g, side:'away'};
      if(h) completeByAbbr[h] = {...g, side:'home'};
    });
  }

  oddsByAbbr = {};
  if(ODDS_LIST){
    ODDS_LIST.forEach(o=>{
      const a = fixAbbr(o.team1), h = fixAbbr(o.team2);
      if(a) oddsByAbbr[a] = {...o, side:'team1'};
      if(h) oddsByAbbr[h] = {...o, side:'team2'};
    });
  }
}
reindex();

/* ============================================================
   COMPUTATION
============================================================ */
function lastN(arr, n){ if(n==='all') return arr.slice(); return arr.slice(Math.max(0,arr.length-n)); }
function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

/* Prefers Leo's richer per-game data (gamesByAbbr, from all_teams_games.json) over the flat
   total_runs_array from the runs log — falls back cleanly when Leo's data isn't loaded for a team. */
function getRunsArray(ab){
  const g = gamesByAbbr[ab];
  if(g && Array.isArray(g.games) && g.games.length){
    return g.games.map(x => Number(x.runs_scored) || 0);
  }
  const t = runsByAbbr[ab];
  return (t && Array.isArray(t.total_runs_array)) ? t.total_runs_array : [];
}
function runsArraySource(ab){
  const g = gamesByAbbr[ab];
  return (g && Array.isArray(g.games) && g.games.length) ? "Leo's per-game log" : "team run logs";
}
function getFormString(ab, n){
  n = n || 10;
  const g = gamesByAbbr[ab];
  if(!g || !Array.isArray(g.games) || !g.games.length) return null;
  return g.games.slice(-n).map(x => x.result || '?').join('');
}

function momentum(arr){
  if(arr.length < 4) return 0;
  const half = Math.min(5, Math.floor(arr.length/2));
  const recent = arr.slice(-half);
  const prior = arr.slice(-2*half, -half);
  if(!prior.length) return 0;
  const rA = avg(recent), pA = avg(prior);
  if(pA === 0) return 0;
  return ((rA - pA) / pA) * 100;
}

function upswing(arr){
  if(arr.length < 5) return false;
  const last2 = avg(arr.slice(-2));
  const prior3 = avg(arr.slice(-5,-2));
  return prior3 > 0 && last2 > prior3 * 1.15;
}

  const up = upswing(arr);
  if(m <= -6 && !up) return {key:"collapse", name:"WINTER COLLAPSE", img:"winter_collapse.png", emoji:"🐻",

    tagline:"Strong momentum. Offense charging.", quote:"Bullish trend with herd strength.", color1:"#2f7343", color2:"#164a29"};
  if(m > 1) return {key:"euphoria", name:"AUTUMN EUPHORIA", img:"autumn_euphoria.png", emoji:"🐏",
    tagline:"Fighting back. Building a case.", quote:"Ram pushing uphill — steady gains.", color1:"#b3742c", color2:"#7a4a17"};
  if(up) return {key:"reversal2", name:"SPRING REVERSAL", img:"spring_reversal.png", emoji:"🐺",
    tagline:"Early signs of life after a lull.", quote:"Wolves regrouping — reversal in progress.", color1:"#3f7d5c", color2:"#1f4a34"};
  return {key:"steady", name:"HOLDING PATTERN", img:"otter.png", emoji:"🦦",
    tagline:"Range-bound. No clear edge yet.", quote:"Otter drifting — waiting for a current.", color1:"#4a5568", color2:"#2d3748"};
}

function strengthLabel(m){
  const a = Math.abs(m);
  if(a > 10) return "STRONG";
  if(a > 5) return "MODERATE";
  if(a > 1.5) return "MILD";
  return "FLAT";
}
function barsOn(m){ return Math.max(1, Math.min(5, Math.round(Math.abs(m)/4) || 1)); }

function normalizeCompleteGame(g){
  const statusStr = (g.status && g.period) ? `${g.status} (${g.period})` : (g.status||'Scheduled');
  return {
    away: g.away_team, home: g.home_team,
    away_score: g.away_score, home_score: g.home_score,
    status: statusStr, venue: g.venue, temp: g.temperature,
    odds: g.odds || {}, period: g.period, half: g.half || 'Top',
    away_record: g.away_record, home_record: g.home_record, tv: g.tv
  };
}
function normalizeScoreGame(g){
  // mlb-scores.json games already carry away/home/scores/status ("In Progress (10)" etc) in the
  // shape the widget expects — no venue/temp/odds/tv here, downstream rendering falls back cleanly.
  return {
    away: g.away, home: g.home,
    away_score: g.away_score, home_score: g.home_score,
    status: g.status || 'Scheduled', odds: {}
  };
}
function findTodayGame(abbr){
  // mlb-scores.json (SCORES/ESPN) is always the primary/active source for score + status — freshest data.
  // Layer venue/temp/odds from the richer feeds on top when available, so nothing gets lost either way.
  const scoreGame = findScoreGame(abbr);
  const completeEntry = completeByAbbr[abbr] ? normalizeCompleteGame(completeByAbbr[abbr]) : null;
  const todayEntry = (TODAY.games||[]).find(g=>{
    const a = abbrFromLoose(g.away) || abbrFromName(g.away||"");
    const h = abbrFromLoose(g.home) || abbrFromName(g.home||"");
    return a===abbr || h===abbr;
  }) || null;

  const richer = completeEntry || todayEntry;
  if(!scoreGame && !richer) return null;
  if(!scoreGame) return richer;

  const merged = normalizeScoreGame(scoreGame);
  if(richer){
    merged.venue = merged.venue || richer.venue;
    merged.temp = merged.temp || richer.temp;
    if(richer.odds && (richer.odds.away_moneyline || richer.odds.home_moneyline || richer.odds.over_under)){
      merged.odds = richer.odds;
    }
  }
  return merged;
}
function findScoreGame(abbr){
  const name = FULL_NAMES[abbr];
  return (SCORES.games||[]).find(g=> (g.away||"").includes(name) || (g.home||"").includes(name)) || null;
}

// Seeded, monotonic per-inning run distribution — runs only ever accumulate, matching real baseball scoring.
function generateInningProgression(total, innings, seedBase){
  if(innings <= 0) return [];
  let seed = seedBase % 2147483647 || 42;
  function rnd(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }
  const weights = Array.from({length:innings}, ()=> rnd()+0.15);
  const wSum = weights.reduce((a,b)=>a+b,0);
  const perInning = weights.map(w=> Math.round((w/wSum)*total));
  let drift = total - perInning.reduce((a,b)=>a+b,0);
  let i = 0;
  while(drift !== 0 && innings>0){
    const idx = i % innings;
    if(drift>0){ perInning[idx]++; drift--; } else if(perInning[idx]>0){ perInning[idx]--; drift++; }
    i++;
    if(i>1000) break;
  }
  const cumulative = [];
  let running = 0;
  perInning.forEach(r=>{ running += r; cumulative.push(running); });
  return cumulative;
}

function renderLiveInningChart(ab){
  remoteData = [];
  remoteLabels = [];
  const game = findTodayGame(ab);
  const footEl = document.getElementById('chartFoot');
  const ctx = document.getElementById('teamChart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  if(!game){
    footEl.innerHTML = `<span>No live or scheduled game found for today</span><span></span>`;
    chartInstance = new Chart(ctx, {
      type:'line', data:{labels:['1','2','3','4','5','6','7','8','9'], datasets:[]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false}}, y:{grid:{color:'#eceef2'}, beginAtZero:true}}}
    });
    return;
  }

  const a = abbrFromLoose(game.away) || abbrFromName(game.away||"") || game.away;
  const h = abbrFromLoose(game.home) || abbrFromName(game.home||"") || game.home;
  const awayScore = parseInt(game.away_score)||0, homeScore = parseInt(game.home_score)||0;
  const inningInfo = getInningDisplay(game);
  const status = game.status || 'Scheduled';
  const isLive = status.includes('In Progress') || status.includes('Live');
  const isFinal = status.includes('Final');

  // Determine current inning from the status text's own keywords, not just the trailing "(N)" —
  // ESPN puts "(1)" on Scheduled games too, so the digit alone doesn't mean the game has started.
  const digitMatch = status.match(/\((\d+)\)/);
  const digit = digitMatch ? parseInt(digitMatch[1]) : null;
  let currentInning;
  if(isFinal){
    currentInning = digit ? Math.min(9, digit) : 9;
  } else if(isLive){
    currentInning = digit ? Math.min(9, Math.max(1, digit)) : 1;
  } else {
    currentInning = 0; // Scheduled — hasn't started, even if status shows "(1)"
  }

  const labels = ['1','2','3','4','5','6','7','8','9'];
  const seed = (awayScore*97 + homeScore*53 + ab.charCodeAt(0)*7 + 11);
  const awayProg = generateInningProgression(awayScore, currentInning, seed);
  const homeProg = generateInningProgression(homeScore, currentInning, seed+1000);
  const pad = arr => arr.concat(Array(9-arr.length).fill(null));

  chartInstance = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      { label:a, data: pad(awayProg), borderColor:'#f23645', borderWidth:2, tension:.3, pointRadius:(ctx)=> ctx.dataIndex===currentInning-1 && isLive ? 5 : 0, pointBackgroundColor:'#f23645', fill:false, spanGaps:false },
      { label:h, data: pad(homeProg), borderColor:'#089981', borderWidth:2, tension:.3, pointRadius:(ctx)=> ctx.dataIndex===currentInning-1 && isLive ? 5 : 0, pointBackgroundColor:'#089981', fill:false, spanGaps:false }
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:true, position:'top', align:'end', labels:{boxWidth:10, font:{size:10.5}, color:'#5c6270'}},
        tooltip:{intersect:false, mode:'index'}
      },
      scales:{
        x:{grid:{display:false}, ticks:{color:'#9298a5', font:{size:10}}, title:{display:true, text:'Inning', font:{size:9.5}, color:'#9298a5'}},
        y:{grid:{color:'#eceef2'}, ticks:{color:'#9298a5', font:{size:10}, precision:0}, beginAtZero:true}
      }
    }
  });

  const statusLabel = isLive ? `🔴 LIVE — ${inningInfo?inningInfo.display:'In Progress'}` : (isFinal ? '✅ Final' : '🕓 Scheduled — not started');
  footEl.innerHTML = `<span>${a} ${awayScore} @ ${h} ${homeScore} · 9 Innings</span><span>${statusLabel}</span>`;
}

/* ============================================================
   PROBABILITY REMOTE — small live readout that scrubs with
   the graph: hover the chart and it reads the probability at
   that point; move off and it settles back to the season figure.
============================================================ */
function bindRemote(idleProb){
  const canvas = document.getElementById('teamChart');
  const val = document.getElementById('remoteVal');
  const sub = document.getElementById('remoteSub');
  const dot = document.getElementById('remoteDot');
  if(!canvas || !val || !sub || !dot) return;

  const setIdle = ()=>{
    val.textContent = idleProb + '%';
    val.classList.remove('live');
    sub.textContent = remoteData.length ? 'Season form' : 'Live view';
    dot.classList.remove('live');
  };
  setIdle();

  canvas.onmousemove = null;
  canvas.onmouseleave = null;
  if(!chartInstance || !remoteData.length) return; // 1G / no series to scrub — stays idle

  const seriesAvg = remoteData.reduce((a,b)=>a+b,0) / remoteData.length;
  canvas.onmousemove = (e)=>{
    const pts = chartInstance.getElementsAtEventForMode(e, 'index', {intersect:false}, true);
    if(!pts.length) return;
    const idx = pts[0].index;
    const runs = remoteData[idx];
    if(runs == null) return;
    const prob = Math.max(5, Math.min(95, Math.round(50 + (runs-seriesAvg)*8)));
    val.textContent = prob + '%';
    val.classList.add('live');
    sub.textContent = remoteLabels[idx] || '';
    dot.classList.add('live');
  };
  canvas.onmouseleave = setIdle;
}

function getInningDisplay(game){
  const status = game.status || '';
  const match = status.match(/\((\d+)\)/);
  if(match){
    const inning = parseInt(match[1]);
    if(!isNaN(inning) && inning>0 && inning<20){
      if(status.includes('Final')) return {display:`Final (${inning})`, half:'Final'};
      if(status.includes('Scheduled')) return {display:`Scheduled`, half:'Scheduled'};
      return {display:`Top ${inning}`, half:'Top'};
    }
  }
  if(game.period && game.half){
    const inning = parseInt(game.period);
    if(!isNaN(inning) && inning>0 && inning<20) return {display:`${game.half} ${inning}`, half:game.half};
  }
  return null;
}

// Synthetic run-differential wave, seeded by the real final score so shape is consistent per game.
function generateChartData(awayScore, homeScore){
  const total = awayScore + homeScore;
  const diff = awayScore - homeScore;
  const base = 4.5 + (total/2) * 0.3;
  const amp = Math.min(2.5, 1.0 + Math.abs(diff)*0.2);
  let seed = (awayScore*31 + homeScore*17 + 7) % 1000;
  function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
  const data = [];
  for(let i=0;i<20;i++){
    const phase = i/2.5;
    const noise = (rnd()-0.5)*0.4;
    data.push(Math.round((base + amp*Math.sin(phase) + noise)*10)/10);
  }
  return data;
}

    {lbl:'Inning', val: inningInfo ? inningInfo.display : (isLive?'Live':status)},
    {lbl:'Venue', val: game.venue || '—'},
    {lbl:'Temp', val: game.temp || '—'},

function freshestTimestamp(){
  // Picks the most current timestamp across every live-ish data source, instead of always trusting
  // the old RUNS.timestamp (which can go stale while GAMES/SCORES keep getting fresher drops).
  const candidates = [RUNS.timestamp, GAMES.timestamp, SCORES.fetched_at, COMPLETE.fetched_at, TODAY.timestamp]
    .filter(Boolean);
  if(!candidates.length) return new Date().toISOString();
  return candidates.reduce((latest, t) => (new Date(t) > new Date(latest) ? t : latest));
}

function jarvisSpeak(text, forcePreview){
  if((!jarvisEnabled && !forcePreview) || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0; u.volume = 1.0;
  if(jarvisThomasVoiceOn){
    u.pitch = 0.8;
    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v => /Daniel|Ryan|Google UK English Male|en-GB.*Male/i.test(`${v.name} ${v.lang}`));
    if(preferred) u.voice = preferred;
  } else {
    u.pitch = 1.0;
  }
  window.speechSynthesis.speak(u);
}

function toggleJarvis(){
  jarvisEnabled = !jarvisEnabled;
  jarvisStatusEl.textContent = jarvisEnabled ? '🟢 Thomas on.' : 'Thomas off.';
  jarvisToggleBtn.textContent = jarvisEnabled ? 'Disable Thomas' : 'Enable Thomas';
  jarvisToggleBtn.style.background = jarvisEnabled ? 'var(--green)' : 'var(--text-faint)';
  if(jarvisEnabled){
    showToast('🎩 Thomas online', 'Watching for score changes and odds shifts.', 'final');
  } else {

    setHeartbeatIdleState();
  }
}

function gameKey(g){ return `${g.away}|${g.home}`; }

function jarvisDiffScores(prevGames, newGames){
  if(!jarvisEnabled) return;
  const prevByKey = {};
  prevGames.forEach(g=> prevByKey[gameKey(g)] = g);
  newGames.forEach(g=>{
    const prev = prevByKey[gameKey(g)];
    if(!prev) return; // brand-new game entry this cycle — nothing to compare against, skip
    const scoreChanged = prev.away_score !== g.away_score || prev.home_score !== g.home_score;
    const justWentFinal = g.status.includes('Final') && !prev.status.includes('Final');
    if(!scoreChanged && !justWentFinal) return;

    const aAb = abbrFromLoose(g.away) || abbrFromName(g.away||'') || g.away;
    const hAb = abbrFromLoose(g.home) || abbrFromName(g.home||'') || g.home;
    const inning = getInningDisplay(g);
    const isFinal = g.status.includes('Final');

    showToast(
      `⚡ Score change: ${aAb} @ ${hAb}`,
      `${g.away_score}-${g.home_score} · ${isFinal ? 'FINAL' : (inning ? inning.display : g.status)}`,
      isFinal ? 'final' : 'live'
    );
        // Skip browser TTS if Mikey's MP3 just played (within last 30s)
    const mp3Fresh = (Date.now() - lastPlayedMp3Time) < 30000;
    if(!mp3Fresh){
      const spoken = isFinal
        ? `Sir, final score alert. ${g.away} ${g.away_score}, ${g.home} ${g.home_score}.`
        : `Sir, score change detected. ${g.away} ${g.away_score}, ${g.home} ${g.home_score}${inning ? ', ' + inning.display : ''}.`;
      jarvisSpeak(spoken);
    }
  });
}

function jarvisDiffOdds(prevOddsByAbbr, newOddsByAbbr){
  if(!jarvisEnabled) return;
  Object.keys(newOddsByAbbr).forEach(ab=>{
    const p = prevOddsByAbbr[ab], n = newOddsByAbbr[ab];
    if(!p || !n) return; // no prior odds for this team to compare against yet
    const pML = p.side === 'team1' ? p.team1_odds : p.team2_odds;
    const nML = n.side === 'team1' ? n.team1_odds : n.team2_odds;
    const changed = pML !== nML || p.spread !== n.spread || p.total !== n.total;
    if(!changed) return;

    showToast(
      `📈 Odds shift: ${ab}`,
      `ML ${pML} → ${nML} · ${n.spread||'—'} · ${n.total||'—'}`,
      'odds'
    );
    jarvisSpeak(`Sir, odds shift detected on ${FULL_NAMES[ab]||ab}. Moneyline moved from ${pML} to ${nML}. Drive the hammer before it moves again.`);
  });
}

function showStatus(msg, ok){ statusEl.textContent = msg; statusEl.className = ok?'ok':'err'; }

function detectAndMerge(json, filename, silent){
  let label = null;

  // Snapshot pre-merge state for Jarvis diffing — cheap deep-ish copies since these are small.
  const prevScoresGames = (SCORES.games||[]).map(g=>({...g}));
  const prevOddsByAbbr = JSON.parse(JSON.stringify(oddsByAbbr||{}));

  if(json.teams && json.teams[0] && json.teams[0].games && json.teams[0].games[0] && ('runs_scored' in json.teams[0].games[0])){
    GAMES = json; label = "Leo's per-game data (runs/results)";
  } else if(json.teams && json.teams[0] && json.teams[0].total_runs_array){
    RUNS = json; label = 'team run history';
  } else if(json.teams && json.teams[0] && ('lynx' in json.teams[0])){
    TEAM_LYNX = json; label = 'team lynx links';
  } else if(json.standings){
    STANDINGS = json; label = 'standings';
  } else if(json.games && json.games[0] && ('away_team' in json.games[0])){
    COMPLETE = json; label = 'complete game feed (venue/odds/TV)';
  } else if(Array.isArray(json) && json[0] && ('team1_odds' in json[0])){
    ODDS_LIST = json; label = 'odds sheet';
  } else if(json.games && json.games[0] && 'away_winner' in json.games[0]){
    SCORES = json; label = 'scores';
  } else if(json.game_data){
    // yahoo_live_full.json — single-game snapshot, keep the last one per matchup
    const gd = json.game_data;
    const teams = (gd.teams||[]).map(t=>t.name);
    YAHOO_LIVE = YAHOO_LIVE.filter(y => JSON.stringify((y.game_data?.teams||[]).map(t=>t.name)) !== JSON.stringify(teams));
    YAHOO_LIVE.push(json);
    label = 'Yahoo live snapshot';
  } else if(json.games){
    TODAY = json; label = "today's games/odds";
  } else {
    if(!silent) showStatus(`Couldn't recognize the shape of ${filename}.`, false);
    return;
  }

  if(!silent) showStatus(`Loaded ${label} from ${filename}.`, true);
  reindex();
  jarvisDiffScores(prevScoresGames, SCORES.games||[]);
  jarvisDiffOdds(prevOddsByAbbr, oddsByAbbr);
  renderAll();
}

async function handleFile(file){
  if(file.name.toLowerCase().endsWith('.txt')){
    showStatus(`${file.name} is a text export — drop the matching .json file instead, txt isn't auto-parsed.`, false);
    return;
  }
  try{
    const text = await file.text();
    const json = JSON.parse(text);
    detectAndMerge(json, file.name);
  }catch(err){
    showStatus(`Error reading ${file.name}: ${err.message}`, false);
  }
}

/* Called every sync cycle from syncLiveFolder(). Silent if no file or no permission. */
async function checkUserMp3(){
  if(!userMp3Handle) return;
  try{
    const perm = await userMp3Handle.queryPermission({mode:'read'});
    if(perm !== 'granted'){
      const req = await userMp3Handle.requestPermission({mode:'read'});
      if(req !== 'granted') return;
    }
    const file = await userMp3Handle.getFile();
    if(file.lastModified <= lastPlayedMp3Time) return;   // nothing new

    if(jarvisEnabled){
      const url = URL.createObjectURL(file);
      const audio = new Audio(url);
      audio.volume = 1.0;
      audio.play()
        .then(()=>{
          lastPlayedMp3Time = file.lastModified;
          console.log(`🎩 Thomas MP3 played: ${file.name}`);
        })
        .catch(err => {
          // Autoplay blocked — don't bump timestamp, retry next cycle after user clicks
          console.warn('🎩 Thomas MP3 blocked — click page once to unlock audio:', err.message);
        });
      audio.onended = () => URL.revokeObjectURL(url);
    } else {
      // Jarvis off — mark seen so we don't replay when it's turned on
      lastPlayedMp3Time = file.lastModified;
    }
  }catch(e){
    // File moved / deleted / no permission — stay silent, user will see "No MP3 chosen" if cleared
  }
}

jarvisMp3ChooseBtn?.addEventListener('click', chooseUserMp3);
jarvisMp3ClearBtn?.addEventListener('click', clearUserMp3);
renderMp3Name();
restoreUserMp3();
const liveSyncStatusEl = document.getElementById('liveSyncStatus');
const connectFolderBtn = document.getElementById('connectFolderBtn');

function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open('mlbDashDB', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('kv');
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('kv','readonly');
    const rq = tx.objectStore('kv').get(key);
    rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error);
  });
}

async function syncLiveFolder(){
  if(!liveDirHandle) return;
  let found = [];
  for(const name of LIVE_FILES){
    try{
      const fh = await liveDirHandle.getFileHandle(name);
      const file = await fh.getFile();
      const text = await file.text();
      const json = JSON.parse(text);
      detectAndMerge(json, name, true);
      found.push(name);
    }catch(e){ /* not present this cycle — fine, skip quietly */ }
  }



  for(const {dir, name} of LIVE_SUBFOLDER_FILES){
    try{
      const subDirHandle = await liveDirHandle.getDirectoryHandle(dir);
      const fh = await subDirHandle.getFileHandle(name);
      const file = await fh.getFile();
      const text = await file.text();
      const json = JSON.parse(text);
      detectAndMerge(json, `${dir}/${name}`, true);
      found.push(`${dir}/${name}`);
    }catch(e){ /* subfolder or file not present this cycle — fine, skip quietly */ }
  }
  // ── Thomas MP3 — user-picked file, checked on its own ──
  await checkUserMp3();
  const now = new Date();
  liveSyncStatusEl.textContent = found.length
    ? `🟢 Synced ${now.toLocaleTimeString()} (${found.length}/${TOTAL_EXPECTED_FILES} files)`
    : `⚠️ Connected, but none of the expected filenames were found in that folder.`;
}

function startLiveSync(){
  connectFolderBtn.textContent = '🔄 Re-sync now';
  syncLiveFolder();
  if(liveSyncTimer) clearInterval(liveSyncTimer);
  liveSyncTimer = setInterval(syncLiveFolder, 20000);
}

async function connectLiveFolder(){
  if(!window.showDirectoryPicker){
    liveSyncStatusEl.textContent = '⚠️ Live folder sync needs Chrome or Edge — use drag & drop above instead.';
    return;
  }
  try{
    const handle = await window.showDirectoryPicker();
    liveDirHandle = handle;
    await idbSet('liveFolderHandle', handle);
    liveSyncStatusEl.textContent = `🟢 Connected: ${handle.name}`;
    startLiveSync();
  }catch(err){
    // user cancelled the picker — leave status as-is
  }
}

async function tryRestoreLiveFolder(){
  if(!window.showDirectoryPicker) return;
  try{
    const handle = await idbGet('liveFolderHandle');
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'read'});
    if(perm === 'granted'){
      liveDirHandle = handle;
      liveSyncStatusEl.textContent = `🟢 Connected: ${handle.name}`;
      startLiveSync();
    } else {
      liveSyncStatusEl.textContent = `📁 "${handle.name}" saved — click Connect folder to re-grant access.`;
    }
  }catch(e){ /* no saved handle yet, ignore */ }
}

connectFolderBtn.addEventListener('click', connectLiveFolder);
tryRestoreLiveFolder();

/* ============================================================
   SIDE PANEL: collapsible tool rows (Load JSON / Live Sync / Jarvis)
============================================================ */
function ensurePanelExpanded(){
  document.getElementById('sidePanel').classList.add('expanded');
  document.getElementById('appRoot').classList.add('expanded');
}
document.querySelectorAll('.tool-row').forEach(row=>{
  row.addEventListener('click', (e)=>{
    if(!document.getElementById('sidePanel').classList.contains('expanded')){
      ensurePanelExpanded();
      // first click on a collapsed rail just expands the sidebar; open the panel too
    }
    const panel = document.getElementById(row.dataset.target);
    const wasOpen = row.classList.contains('open');
    document.querySelectorAll('.tool-row.open').forEach(r=>{
      if(r!==row){ r.classList.remove('open'); document.getElementById(r.dataset.target).classList.remove('open'); }
    });
    row.classList.toggle('open', !wasOpen);
    panel.classList.toggle('open', !wasOpen);
  });
});
// Don't let clicks inside the tool panel (input, buttons) bubble up and re-toggle it closed.
document.querySelectorAll('.tool-panel').forEach(p=> p.addEventListener('click', e=> e.stopPropagation()));

function watchStatusDot(statusElId, dotElId){
  const statusEl = document.getElementById(statusElId);
  const dotEl = document.getElementById(dotElId);
  if(!statusEl || !dotEl) return;
  const update = ()=> dotEl.classList.toggle('on', statusEl.textContent.includes('🟢'));
  update();
  new MutationObserver(update).observe(statusEl, {childList:true, characterData:true, subtree:true});
}
watchStatusDot('liveSyncStatus','liveSyncDot');
watchStatusDot('jarvisStatus','jarvisDot');
new MutationObserver(()=>{
  document.getElementById('dropStatusDot').classList.toggle('on', document.getElementById('dropStatus').classList.contains('ok'));
}).observe(document.getElementById('dropStatus'), {attributes:true, attributeFilter:['class']});

/* ============================================================
   SIDE PANEL: team finder
============================================================ */
const teamFinderEl = document.getElementById('teamFinder');
function applyTeamFilter(){
  const q = teamFinderEl.value.trim().toLowerCase();
  document.querySelectorAll('#sidebar .panel-item[data-ab]').forEach(btn=>{
    const ab = btn.dataset.ab;
    const name = (FULL_NAMES[ab]||'').toLowerCase();
    const match = !q || name.includes(q) || ab.toLowerCase().includes(q);
    btn.classList.toggle('team-hidden', !match);
  });
  document.querySelectorAll('#sidebar .divider-label').forEach(lbl=>{
    let sib = lbl.nextElementSibling, anyVisible = false;
    while(sib && !sib.classList.contains('divider-label')){
      if(sib.matches('.panel-item[data-ab]') && !sib.classList.contains('team-hidden')) anyVisible = true;
      sib = sib.nextElementSibling;
    }
    lbl.classList.toggle('team-hidden', !!q && !anyVisible);
  });
}
teamFinderEl.addEventListener('focus', ensurePanelExpanded);
teamFinderEl.addEventListener('input', applyTeamFilter);

   SIDE PANEL: live clock
============================================================ */
function tickClock(){
  const now = new Date();
  const t = document.getElementById('clkTime');
  const d = document.getElementById('clkDate');
  if(t) t.textContent = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  if(d) d.textContent = now.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
tickClock();
setInterval(tickClock, 1000);

/* Close the Team Info popover on outside click (delegated once, survives re-renders) */
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('teamInfoPop');
  const toggle = document.getElementById('teamInfoToggle');
  if(!pop || !toggle) return;
  if(!pop.classList.contains('open')) return;
  if(pop.contains(e.target) || toggle.contains(e.target)) return;
  pop.classList.remove('open');
  toggle.classList.remove('open');
});

renderAll();
})();
